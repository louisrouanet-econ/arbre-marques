name: Mise hors ligne du site

# Le 31 août 2026 à 22:00 UTC (= 1er septembre 00:00 à Paris), le site est
# remplacé par une page de fermeture et l'historique git est effacé, afin que
# les données familiales disparaissent du dépôt public. Déclenchable aussi à
# la main depuis l'onglet Actions. (Le cron se répète chaque année ; une fois
# le site fermé, le job est sans effet.)

on:
  schedule:
    - cron: "0 22 31 8 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sunset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retirer le site et effacer l'historique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan sunset
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp .github/closed.html index.html
          touch .nojekyll
          git add -A
          git commit -m "Site hors ligne (fermeture programmée fin août 2026)"
          git push --force origin sunset:main
